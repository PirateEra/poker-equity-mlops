apiVersion: apps/v1
kind: Deployment
metadata:
  name: poker-api
  labels:
    app: poker-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poker-api
  template:
    metadata:
      labels:
        app: poker-api
    spec:
      containers:
        - name: poker-api
          image: poker:latest
          imagePullPolicy: Never
          command: ["uvicorn"]
          args: ["src.api.main_api:app", "--host", "0.0.0.0", "--port", "5001"]
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: poker-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
